name: CI @nuxt/test-utils

on:
  workflow_dispatch:
    inputs:
      hash:
        type: string
        required: true
      e2e:
        type: boolean
        default: false
      nuxt:
        type: boolean
        default: true
      nuxt-ui:
        type: boolean
        default: true
      npmx:
        type: boolean
        default: true

permissions: {}

jobs:
  nuxt:
    if: inputs.nuxt
    name: nuxt/nuxt - runtime
    uses: ./.github/workflows/_test-utils-ci.yml
    with:
      hash: ${{ inputs.hash }}
      repository: nuxt/nuxt
      tests: |
        pnpm run dev:prepare
        pnpm run test:runtime --fsModuleCache
        pnpm run test:runtime --fsModuleCache

  nuxt-e2e:
    if: inputs.nuxt && inputs.e2e
    name: nuxt/nuxt - e2e
    uses: ./.github/workflows/_test-utils-ci.yml
    with:
      hash: ${{ inputs.hash }}
      repository: nuxt/nuxt
      setup:
        pnpm exec playwright-core install chromium --with-deps
      tests: |
        pnpm run test:e2e

  nuxt-ui:
    if: inputs.nuxt-ui
    name: nuxt/ui - runtime
    uses: ./.github/workflows/_test-utils-ci.yml
    with:
      hash: ${{ inputs.hash }}
      repository: nuxt/ui
      branch: v4
      tests: |
        pnpm run dev:prepare
        pnpm run test

  npmx:
    if: inputs.npmx
    name: npmx.dev - runtime
    uses: ./.github/workflows/_test-utils-ci.yml
    with:
      hash: ${{ inputs.hash }}
      repository: npmx-dev/npmx.dev
      setup: |
        git apply --ignore-whitespace << 'EOF'
        diff --git a/vite.config.ts b/vite.config.ts
        --- a/vite.config.ts
        +++ b/vite.config.ts
        @@ -228,6 +228,7 @@ export default defineConfig({
                       ),
                     },
                   },
        +          optimizeDeps: { noDiscovery: true },
                   test: {
                     name: 'nuxt',
                     include: ['test/nuxt/**/*.{test,spec}.ts'],
        EOF
        pnpm exec playwright install chromium-headless-shell --with-deps
      tests: |
        pnpm run test:nuxt --fsModuleCache
        pnpm run test:nuxt --fsModuleCache
